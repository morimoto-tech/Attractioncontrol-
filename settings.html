<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレショー設定ページ</title>
  <style>
    :root {
      --bg: #101827;
      --panel: rgba(24, 34, 53, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f3f7ff;
      --muted: #9db0d0;
      --accent: #ff6b3d;
      --accent-soft: rgba(255, 107, 61, 0.16);
      --radius: 22px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(255, 107, 61, 0.18), transparent 28%),
        linear-gradient(180deg, #162033 0%, var(--bg) 100%);
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ffb79f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 12px; font-size: clamp(28px, 5vw, 42px); line-height: 1.08; }
    h2 { font-size: 20px; margin-bottom: 6px; }
    .sub { margin-top: 10px; color: var(--muted); line-height: 1.6; }

    .scene-list,
    .settings-list {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="file"],
    input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
    }

    .meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 720px) {
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <span class="eyebrow">Settings Only</span>
      <h1>プレショー設定</h1>
      <p class="sub">映像、音声、秒数、音量をここでまとめて設定します。操作は `control.html` で行います。</p>
      <div class="actions">
        <button class="secondary" id="openControlBtn" type="button">control.html を開く</button>
        <button class="secondary" id="openDisplayBtn" type="button">display.html を開く</button>
      </div>
    </section>

    <section class="panel">
      <h2>素材登録</h2>
      <div class="scene-list" id="sceneUploadList"></div>
    </section>

    <section class="panel">
      <h2>基本設定</h2>
      <div class="settings-list">
        <div class="card">
          <div class="field">
            <label for="endingDelayInput">終了後の表示秒数</label>
            <input id="endingDelayInput" type="number" min="1" value="15">
          </div>
        </div>
        <div class="card">
          <div class="field">
            <label for="masterVolumeInput">全体音量</label>
            <input id="masterVolumeInput" type="number" min="0" max="100" value="100">
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveSettingsBtn" type="button">設定を保存</button>
        <button class="secondary" id="loadDemoBtn" type="button">デモ状態</button>
      </div>
    </section>
  </div>

  <script>
    const stateUrl = "/api/state";
    const eventSource = new EventSource("/events");
    const controlUrl = `${window.location.origin}/control.html`;
    const displayUrl = `${window.location.origin}/display.html`;
    let state = null;

    document.getElementById("openControlBtn").addEventListener("click", () => window.open(controlUrl, "_blank"));
    document.getElementById("openDisplayBtn").addEventListener("click", () => window.open(displayUrl, "_blank"));
    document.getElementById("saveSettingsBtn").addEventListener("click", saveSettings);
    document.getElementById("loadDemoBtn").addEventListener("click", loadDemo);

    eventSource.onmessage = (event) => {
      state = JSON.parse(event.data);
      render();
    };

    fetchState();

    async function fetchState() {
      const response = await fetch(stateUrl, { cache: "no-store" });
      state = await response.json();
      render();
    }

    async function saveSettings() {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endingReturnDelay: Number(document.getElementById("endingDelayInput").value),
          masterVolume: Number(document.getElementById("masterVolumeInput").value)
        })
      });
    }

    async function loadDemo() {
      await fetch("/api/demo", { method: "POST" });
    }

    async function uploadMedia(sceneId, kind, file) {
      if (!file) {
        return;
      }

      const form = new FormData();
      form.append("sceneId", sceneId);
      form.append("kind", kind);
      form.append("file", file);

      await fetch("/api/upload", {
        method: "POST",
        body: form
      });
    }

    function render() {
      if (!state) {
        return;
      }

      document.getElementById("endingDelayInput").value = state.endingReturnDelay;
      document.getElementById("masterVolumeInput").value = state.masterVolume;
      renderUploadList();
    }

    function renderUploadList() {
      const container = document.getElementById("sceneUploadList");
      container.innerHTML = state.availableScenes.map((scene) => `
        <div class="card">
          <div class="card-head">
            <h3>${escapeHtml(scene.title)}</h3>
            <span class="pill">${state.currentScene === scene.id ? "現在のシーン" : "登録用"}</span>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="video-${scene.id}">映像</label>
              <input id="video-${scene.id}" type="file" accept="video/*">
              <div class="meta">${escapeHtml(state.scenes[scene.id].videoName || "未登録")}</div>
            </div>
            <div class="field">
              <label for="audio-${scene.id}">音声</label>
              <input id="audio-${scene.id}" type="file" accept="audio/*">
              <div class="meta">${escapeHtml(state.scenes[scene.id].audioName || "未登録")}</div>
            </div>
          </div>
        </div>
      `).join("");

      state.availableScenes.forEach((scene) => {
        document.getElementById(`video-${scene.id}`).addEventListener("change", (event) => {
          void uploadMedia(scene.id, "video", event.target.files[0]);
        });
        document.getElementById(`audio-${scene.id}`).addEventListener("change", (event) => {
          void uploadMedia(scene.id, "audio", event.target.files[0]);
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
  </script>
</body>
</html>
