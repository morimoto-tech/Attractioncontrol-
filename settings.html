<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレショー設定ページ</title>
  <style>
    :root {
      --bg: #101827;
      --panel: rgba(24, 34, 53, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f3f7ff;
      --muted: #9db0d0;
      --accent: #ff6b3d;
      --accent-soft: rgba(255, 107, 61, 0.16);
      --radius: 22px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(255, 107, 61, 0.18), transparent 28%),
        linear-gradient(180deg, #162033 0%, var(--bg) 100%);
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ffb79f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, h3, p, ul { margin: 0; }
    h1 { margin-top: 12px; font-size: clamp(28px, 5vw, 42px); line-height: 1.08; }
    h2 { font-size: 20px; margin-bottom: 6px; }
    .sub { margin-top: 10px; color: var(--muted); line-height: 1.7; }

    .grid {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .card {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <span class="eyebrow">Settings Only</span>
      <h1>プレショー設定</h1>
      <p class="sub">今回は固定で2本の映像を使います。開始前はループ、本編は少し大きめの音量、終了後は30秒待機して開始前へ戻る設定です。</p>
      <div class="actions">
        <button class="secondary" id="openControlBtn" type="button">control.html を開く</button>
        <button class="secondary" id="openDisplayBtn" type="button">display.html を開く</button>
      </div>
    </section>

    <section class="panel">
      <h2>使用映像</h2>
      <div class="grid">
        <div class="card">
          <span class="pill">開始前</span>
          <p class="meta" id="standbyUrlLabel"></p>
        </div>
        <div class="card">
          <span class="pill">プレショー本編</span>
          <p class="meta" id="mainUrlLabel"></p>
        </div>
        <div class="card">
          <span class="pill">終了後</span>
          <p class="meta">映像なし。30秒待機したあと、自動で開始前に戻ります。</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>基本設定</h2>
      <div class="grid">
        <div class="card">
          <div class="field">
            <label for="endingDelayInput">終了後の待機秒数</label>
            <input id="endingDelayInput" type="number" min="1" value="30">
          </div>
        </div>
        <div class="card">
          <div class="field">
            <label for="masterVolumeInput">基本音量</label>
            <input id="masterVolumeInput" type="number" min="0" max="100" value="100">
          </div>
          <p class="meta">本編はこの音量より少し大きく再生されます。</p>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveSettingsBtn" type="button">設定を保存</button>
        <button class="secondary" id="loadDemoBtn" type="button">デモ状態</button>
      </div>
    </section>
  </div>

  <script>
    const stateUrl = "/api/state";
    const eventSource = new EventSource("/events");
    const controlUrl = `${window.location.origin}/control.html`;
    const displayUrl = `${window.location.origin}/display.html`;
    let state = null;

    document.getElementById("openControlBtn").addEventListener("click", () => window.open(controlUrl, "_blank"));
    document.getElementById("openDisplayBtn").addEventListener("click", () => window.open(displayUrl, "_blank"));
    document.getElementById("saveSettingsBtn").addEventListener("click", saveSettings);
    document.getElementById("loadDemoBtn").addEventListener("click", loadDemo);

    eventSource.onmessage = (event) => {
      state = JSON.parse(event.data);
      render();
    };

    fetchState();

    async function fetchState() {
      const response = await fetch(stateUrl, { cache: "no-store" });
      state = await response.json();
      render();
    }

    async function saveSettings() {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          endingReturnDelay: Number(document.getElementById("endingDelayInput").value),
          masterVolume: Number(document.getElementById("masterVolumeInput").value)
        })
      });
    }

    async function loadDemo() {
      await fetch("/api/demo", { method: "POST" });
    }

    function render() {
      if (!state) {
        return;
      }

      document.getElementById("endingDelayInput").value = state.endingReturnDelay;
      document.getElementById("masterVolumeInput").value = state.masterVolume;
      document.getElementById("standbyUrlLabel").textContent = state.scenes.standby.videoUrl || "-";
      document.getElementById("mainUrlLabel").textContent = state.scenes.main.videoUrl || "-";
    }
  </script>
</body>
</html>
