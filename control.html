<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレショー操作パネル</title>
  <style>
    :root {
      --bg: #101827;
      --panel: rgba(24, 34, 53, 0.94);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f3f7ff;
      --muted: #9db0d0;
      --accent: #ff6b3d;
      --accent-soft: rgba(255, 107, 61, 0.16);
      --danger: #ff6178;
      --radius: 22px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(255, 107, 61, 0.18), transparent 28%),
        linear-gradient(180deg, #162033 0%, var(--bg) 100%);
    }

    .shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .warning {
      display: none;
      background: rgba(255, 97, 120, 0.12);
      border-color: rgba(255, 97, 120, 0.22);
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ffb79f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, p { margin: 0; }

    h1 {
      margin-top: 12px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.08;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .sub {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .status-card {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .status-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .status-card strong {
      font-size: 28px;
    }

    .scene-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      padding: 20px;
      font: inherit;
      font-weight: 800;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
    }

    .scene-btn {
      min-height: 118px;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .scene-btn small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
    }

    .scene-btn.active {
      background: linear-gradient(135deg, rgba(255, 107, 61, 0.34), rgba(255, 107, 61, 0.12));
      border-color: rgba(255, 107, 61, 0.55);
    }

    .stop-btn {
      background: rgba(255, 97, 120, 0.14);
      color: #ffc8d1;
      border: 1px solid rgba(255, 97, 120, 0.18);
    }

    .link-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .link-box {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .link-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: 14px;
      width: auto;
    }

    @media (max-width: 720px) {
      .status-grid,
      .scene-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel warning" id="fileModeWarning">
      <h2>共有モードではありません</h2>
      <p class="sub">別端末と同期するには `http://localhost:8787/control.html` または公開URLで開いてください。</p>
    </section>

    <section class="panel">
      <span class="eyebrow">Control Only</span>
      <h1>プレショー操作</h1>
      <p class="sub">このページは本番中に押すための画面です。素材登録や細かい設定は別ページに分けています。</p>

      <div class="status-grid">
        <div class="status-card">
          <span>現在のシーン</span>
          <strong id="currentSceneLabel">待機中</strong>
        </div>
        <div class="status-card">
          <span>自動復帰まで</span>
          <strong id="returnCountdown">-</strong>
        </div>
        <div class="status-card">
          <span>表示ページ</span>
          <strong id="displayUrlLabel" style="font-size:18px;">/display.html</strong>
        </div>
      </div>

      <div class="scene-buttons" id="sceneButtons"></div>
    </section>

    <section class="panel">
      <h2>別ページ</h2>
      <p class="sub">設定変更や素材登録は下のページで行います。</p>
      <div class="link-list">
        <div class="link-box">
          <strong>設定・素材ページ</strong>
          <p class="sub">映像、音声、終了後の秒数、音量を設定します。</p>
          <div class="link-actions">
            <button class="secondary" id="openSettingsBtn" type="button">settings.html を開く</button>
          </div>
        </div>
        <div class="link-box">
          <strong>表示ページ</strong>
          <p class="sub">表示端末ではこのページを開きます。</p>
          <div class="link-actions">
            <button class="secondary" id="copyDisplayUrlBtn" type="button">表示URLをコピー</button>
            <button class="secondary" id="openDisplayBtn" type="button">display.html を開く</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const stateUrl = "/api/state";
    const settingsUrl = `${window.location.origin}/settings.html`;
    const displayUrl = `${window.location.origin}/display.html`;
    const eventSource = new EventSource("/events");
    let state = null;
    let countdownInterval = null;

    if (window.location.protocol === "file:") {
      document.getElementById("fileModeWarning").style.display = "block";
      document.getElementById("displayUrlLabel").textContent = "http://localhost:8787/display.html";
    }

    document.getElementById("openSettingsBtn").addEventListener("click", () => window.open(settingsUrl, "_blank"));
    document.getElementById("copyDisplayUrlBtn").addEventListener("click", copyDisplayUrl);
    document.getElementById("openDisplayBtn").addEventListener("click", () => window.open(displayUrl, "_blank"));

    eventSource.onmessage = (event) => {
      state = JSON.parse(event.data);
      render();
    };

    fetchState();

    async function fetchState() {
      const response = await fetch(stateUrl, { cache: "no-store" });
      state = await response.json();
      render();
    }

    async function activateScene(sceneId) {
      await fetch("/api/scene", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sceneId })
      });
    }

    async function stopAll() {
      await fetch("/api/stop", { method: "POST" });
    }

    async function copyDisplayUrl() {
      try {
        await navigator.clipboard.writeText(displayUrl);
      } catch (error) {
        window.prompt("表示ページURL", displayUrl);
      }
    }

    function render() {
      if (!state) {
        return;
      }

      const scene = state.availableScenes.find((item) => item.id === state.currentScene);
      document.getElementById("currentSceneLabel").textContent = scene?.title || "-";
      document.getElementById("displayUrlLabel").textContent = "/display.html";
      renderSceneButtons();
      renderCountdown();
    }

    function renderSceneButtons() {
      const container = document.getElementById("sceneButtons");
      const buttons = state.availableScenes.map((scene) => `
        <button class="scene-btn ${state.currentScene === scene.id ? "active" : ""}" type="button" data-scene="${scene.id}">
          ${escapeHtml(scene.title)}
          <small>${escapeHtml(scene.message)}</small>
        </button>
      `);

      buttons.push(`
        <button class="scene-btn stop-btn" type="button" id="stopAllBtn">
          停止
          <small>すべての再生を止める</small>
        </button>
      `);

      container.innerHTML = buttons.join("");

      container.querySelectorAll("[data-scene]").forEach((button) => {
        button.addEventListener("click", () => activateScene(button.dataset.scene));
      });
      document.getElementById("stopAllBtn").addEventListener("click", stopAll);
    }

    function renderCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      const el = document.getElementById("returnCountdown");
      const update = () => {
        if (!state?.returnAt) {
          el.textContent = "-";
          return;
        }
        const seconds = Math.max(0, Math.ceil((state.returnAt - Date.now()) / 1000));
        el.textContent = `${seconds}秒`;
      };

      update();
      countdownInterval = setInterval(update, 250);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
  </script>
</body>
</html>
