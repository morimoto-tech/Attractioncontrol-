<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレショー表示ページ</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      overflow: hidden;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(255, 107, 61, 0.16), transparent 34%),
        #000;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
      color: rgba(255, 255, 255, 0.88);
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(255, 107, 61, 0.12), transparent 38%),
        rgba(0, 0, 0, 0.82);
    }

    .overlay strong {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 800;
    }

    .overlay span {
      max-width: 40rem;
      font-size: clamp(14px, 1.4vw, 20px);
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }

    .overlay button {
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 999px;
    }

    .corner {
      position: absolute;
      left: 22px;
      bottom: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .actions {
      position: absolute;
      right: 22px;
      bottom: 18px;
      display: flex;
      gap: 10px;
    }

    .actions button {
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="stage">
    <video id="videoPlayer" playsinline></video>
    <div class="overlay" id="overlay">
      <strong id="sceneLabel">開始前シーン</strong>
      <span id="sceneMessage">操作ページから再生を開始してください。</span>
      <button id="enablePlaybackBtn">再生を有効化</button>
    </div>
    <div class="corner" id="statusLabel">接続待機中</div>
    <div class="actions">
      <button id="fullscreenBtn">全画面</button>
    </div>
  </div>

  <script>
    const eventSource = new EventSource("/events");
    const videoPlayer = document.getElementById("videoPlayer");
    const overlay = document.getElementById("overlay");
    const sceneLabel = document.getElementById("sceneLabel");
    const sceneMessage = document.getElementById("sceneMessage");
    const statusLabel = document.getElementById("statusLabel");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const enablePlaybackBtn = document.getElementById("enablePlaybackBtn");

    let state = null;
    let countdownInterval = null;
    let playbackUnlocked = false;
    let playbackBlocked = false;
    let videoErrorMessage = "";

    fullscreenBtn.addEventListener("click", async () => {
      const root = document.documentElement;
      if (!document.fullscreenElement && root.requestFullscreen) {
        try {
          await root.requestFullscreen();
        } catch (error) {}
      }
      await unlockPlayback();
      render();
    });

    enablePlaybackBtn.addEventListener("click", async () => {
      await unlockPlayback();
      render();
    });

    eventSource.onmessage = (event) => {
      state = JSON.parse(event.data);
      render();
    };

    videoPlayer.addEventListener("loadeddata", () => {
      videoErrorMessage = "";
      updateOverlay();
    });

    videoPlayer.addEventListener("error", () => {
      videoErrorMessage = "映像を再生できません。URLか形式を確認してください。";
      updateOverlay();
    });

    fetch("/api/state", { cache: "no-store" })
      .then((response) => response.json())
      .then((payload) => {
        state = payload;
        render();
      });

    function render() {
      if (!state) {
        return;
      }

      const scene = state.availableScenes.find((item) => item.id === state.currentScene);
      const sceneMedia = state.scenes[state.currentScene];

      sceneLabel.textContent = `${scene?.title || "-"}シーン`;
      sceneMessage.textContent = scene?.message || "";
      statusLabel.textContent = statusText(scene?.title || "-");

      assignMedia(videoPlayer, sceneMedia.videoUrl);
      videoPlayer.loop = state.currentScene === "standby";
      videoPlayer.volume = sceneVolume(sceneMedia);

      if (state.isPlaying && sceneMedia.videoUrl) {
        void playVideo();
      } else {
        videoPlayer.pause();
      }

      updateOverlay(scene);
      renderCountdown();
    }

    function renderCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      const update = () => {
        const scene = state?.availableScenes.find((item) => item.id === state.currentScene);
        statusLabel.textContent = statusText(scene?.title || "-");
      };

      update();
      countdownInterval = setInterval(update, 250);
    }

    function statusText(title) {
      if (videoErrorMessage) {
        return `${title} / 映像確認`;
      }
      if (playbackBlocked) {
        return `${title} / 表示端末で再生許可待ち`;
      }
      if (state?.returnAt) {
        const seconds = Math.max(0, Math.ceil((state.returnAt - Date.now()) / 1000));
        return `${title} / 開始前へ ${seconds}秒`;
      }
      return state?.isPlaying ? `${title} / 再生中` : `${title} / 停止中`;
    }

    function assignMedia(player, url) {
      if (!url) {
        player.removeAttribute("src");
        player.load();
        return;
      }
      if (player.src !== url) {
        player.src = url;
      }
    }

    function sceneVolume(sceneMedia) {
      const base = (state?.masterVolume ?? 100) / 100;
      const multiplier = sceneMedia?.volumeMultiplier ?? 1;
      return Math.max(0, Math.min(1, base * multiplier));
    }

    async function playVideo() {
      try {
        if (videoPlayer.src && videoPlayer.paused) {
          await videoPlayer.play();
        }
        playbackBlocked = false;
      } catch (error) {
        playbackBlocked = true;
      }
      updateOverlay();
    }

    async function unlockPlayback() {
      playbackUnlocked = true;
      playbackBlocked = false;

      try {
        if (videoPlayer.src) {
          await videoPlayer.play();
          videoPlayer.pause();
          videoPlayer.currentTime = 0;
        }
      } catch (error) {}

      playbackBlocked = false;
      updateOverlay();
    }

    function updateOverlay(scene = state?.availableScenes.find((item) => item.id === state?.currentScene)) {
      const shouldShow = !state?.isPlaying || playbackBlocked || Boolean(videoErrorMessage) || !state?.scenes?.[state.currentScene]?.videoUrl;
      overlay.style.display = shouldShow ? "flex" : "none";

      if (videoErrorMessage) {
        sceneLabel.textContent = `${scene?.title || "-"}シーン`;
        sceneMessage.textContent = videoErrorMessage;
      } else if (playbackBlocked) {
        sceneLabel.textContent = `${scene?.title || "-"}シーン`;
        sceneMessage.textContent = "表示端末で一度だけ「再生を有効化」を押してください。";
      } else if (!state?.isPlaying) {
        sceneLabel.textContent = `${scene?.title || "-"}シーン`;
        sceneMessage.textContent = scene?.message || "操作ページから再生を開始してください。";
      } else if (!state?.scenes?.[state.currentScene]?.videoUrl) {
        sceneLabel.textContent = `${scene?.title || "-"}シーン`;
        sceneMessage.textContent = scene?.message || "";
      }

      enablePlaybackBtn.style.display = playbackBlocked || !playbackUnlocked ? "inline-flex" : "none";
    }
  </script>
</body>
</html>
