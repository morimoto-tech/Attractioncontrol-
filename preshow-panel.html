<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレショー同期版の案内</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Yu Gothic UI", "Hiragino Sans", sans-serif;
      color: #f7f4ef;
      background:
        radial-gradient(circle at top right, rgba(255, 107, 61, 0.22), transparent 28%),
        linear-gradient(180deg, #162033 0%, #0c1220 100%);
    }

    .card {
      width: min(760px, 100%);
      padding: 32px;
      border-radius: 24px;
      background: rgba(18, 27, 43, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 107, 61, 0.16);
      color: #ffb49d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, p, li { margin: 0; }
    h1 {
      margin-top: 16px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
    }
    p, li {
      color: rgba(247, 244, 239, 0.78);
      line-height: 1.7;
    }

    ul {
      margin: 20px 0 0;
      padding-left: 20px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
    }

    .primary {
      background: #ff6b3d;
      color: white;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f7f4ef;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Pre-show Sync</span>
    <h1>プレショーは2ページ構成に切り替わりました</h1>
    <p style="margin-top: 14px;">
      別端末で同期させるため、`操作ページ` と `表示ページ` をローカルサーバー経由で開く方式に変更しています。
    </p>
    <ul>
      <li>`start-preshow-server.bat` を実行してサーバーを起動</li>
      <li>操作端末では `control.html` を開く</li>
      <li>表示端末では `display.html` を開く</li>
    </ul>
    <div class="links">
      <a class="primary" href="http://localhost:8787/control.html">操作ページを開く</a>
      <a class="secondary" href="http://localhost:8787/display.html">表示ページを開く</a>
    </div>
  </div>
</body>
</html>
